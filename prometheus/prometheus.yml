- job_name: 'blackbox_server1_rest_api'
  scrape_interval: 2m
  metrics_path: /probe
  params:
    module: [http_api_server1]               # use the module above
  static_configs:
    - targets:
        - https://server:1243/level1/api/level2
      labels:
        exporter_type: 'blackbox'
        server_group: 'API_GW_servers'
        team: 'admins0007'
        environment: 'prod'
  relabel_configs:
    # Send the full URL to Blackbox as the “target” query arg
    - source_labels: [__address__]
      target_label: __param_target

    # Preserve the URL as a friendly label
    - source_labels: [__param_target]
      target_label: url

    # set the instance label to the hostname portion of the URL
    - source_labels: [__address__]
      regex: ^https:\/\/(.*):.*$
      replacement: $1
      target_label: instance

    # Final hop: point Prometheus to the Blackbox exporter
    - target_label: __address__
      replacement: blackbox:9115

- job_name: "blackbox_icmp"
  scrape_interval: 2m
  metrics_path: /probe
  params:
    module: ["icmp_ipv4"]               # same for every target
  file_sd_configs:
    - files:
        - 'blackbox_icmp_targets.json'
      refresh_interval: 1m

  relabel_configs:
    # pass FQDN/IP as ?target=
    - source_labels: [__address__]
      target_label: __param_target

    # nice label for dashboards
    - source_labels: [__param_target]
      target_label: instance

    # send probe to exporter
    - target_label: __address__
      replacement: blackbox:9115

- job_name: "blackbox_https_texts"
  scrape_interval: "120s"
  metrics_path: /probe
  #params:
  #  module: ["https_text_contains"]   # same for every target
  file_sd_configs:
    - files:
        - 'blackbox_https_targets.json'
      refresh_interval: 1m

  relabel_configs:
    # URL -> ?target=
    - source_labels: [__address__]
      target_label: __param_target
    # per-module
    - source_labels: [module]
      target_label: __param_module
    # nicer label in Prom/Grafana
    - source_labels: [__param_target]
      target_label: instance
    # actually scrape the blackbox exporter
    - target_label: __address__
      replacement: blackbox:9115