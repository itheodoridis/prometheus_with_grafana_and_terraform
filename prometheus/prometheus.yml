- job_name: 'blackbox_dns_admins0008'
  scrape_interval: 5m
  metrics_path: /probe
  static_configs:
    - targets:
        - server2.company.com:10.10.10.10
        - server2.company.com:10.10.10.11
        - server1.company.com:10.10.10.10
        - server1.company.com:10.10.10.11        
      labels:
        exporter_type: 'blackbox'
        server_group: 'admins0008_Servers'
        team: 'admins0008'
        environment: 'prod'
  relabel_configs:
  # Populate fqdn label with fqdn portion of __address__
  - source_labels: [__address__]
    regex: (.*):.*$
    replacement: $1
    target_label: fqdn
  # Populate dnsserver label with dns server IP portion of __address__
  - source_labels: [__address__]
    regex: .*:(.*)$
    replacement: $1
    target_label: dnsserver
  # Populate instance label with hostname portion of fqdn in __address__
  - source_labels: [__address__]
    regex: (^.*)\..*\..*:.*$
    replacement: $1
    target_label: instance    
  # Populate module URL parameter with fqdn portion of __address__
  # This is a parameter passed to the blackbox exporter
  - source_labels: [fqdn]
    target_label: __param_module
  # Populate target URL parameter with dns server IP
  - source_labels: [dnsserver]
    target_label: __param_target
  # Populate __address__ with the address of the blackbox exporter to hit
  - target_label: __address__
    replacement: blackbox:9115

