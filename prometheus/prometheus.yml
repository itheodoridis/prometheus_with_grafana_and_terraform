global:
  scrape_interval: "30s"
  scrape_timeout: "10s"

rule_files:
  - "alert.yml"

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: [ 'alertmanager:9093' ]

scrape_configs:
- job_name: node_local
  static_configs:
  - targets: ['nodeexporter:9100']
    labels:
      exporter_type: 'node'
      server_group: 'local'
      team: 'adminonly'
      environment: 'prod'
- job_name: process_local
  static_configs:
  - targets: ['processexporter:9256']
    labels:
      exporter_type: 'process'
      server_group: 'local'
      team: 'adminonly'
      environment: 'prod'
- job_name: cadvisor_local
  scrape_interval: 60s
  static_configs:
  - targets: ['cadvisor:8080']
    labels:
      exporter_type: 'cadvisor'
      server_group: 'local'
      team: 'adminonly'
      environment: 'prod'

- job_name: vmware_vcenter
  scrape_interval: 60s
  static_configs:
  - targets: ['vmware-exporter-dc1:9272', 'vmware-exporter-dc2:9272']
- job_name: admins0005_linux_servers
